<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>GitHub | Saleh Alkarabubi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #14213d 0,
          #07101f 48%,
          #030812 100%
        );
      color: #f8fafc;
    }

    .profile-shell {
      width: min(620px, 100%);
      padding: 42px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 26px;
      background: rgba(9, 17, 32, 0.92);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    .label {
      color: #60a5fa;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    h1 {
      margin: 12px 0 12px;
      font-size: clamp(2.3rem, 8vw, 4rem);
      letter-spacing: -0.05em;
    }

    p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.75;
    }

    .return-note {
      margin-top: 16px;
      padding: 13px 15px;
      border: 1px solid rgba(96, 165, 250, 0.16);
      border-radius: 12px;
      background: rgba(59, 130, 246, 0.06);
      color: #8ea3be;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary {
      background: #f8fafc;
      color: #07101f;
    }

    .secondary {
      border: 1px solid rgba(148, 163, 184, 0.26);
      color: #f8fafc;
    }
  </style>
</head>

<body>
  <main class="profile-shell">
    <span class="label">GITHUB PROFILE</span>

    <h1>My GitHub</h1>

    <p>
      View my repositories, source code and public
      development activity on GitHub.
    </p>

    <p class="return-note">
      GitHub opens in a new tab. This portfolio page
      stays open so you can return easily.
    </p>

    <div class="actions">
      <a
        class="primary"
        href="https://github.com/karabubi?tab=repositories"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open GitHub in New Tab ↗
      </a>

      <a class="secondary" href="/photos">
        ← Back to Projects
      </a>

      <a class="secondary" href="/">
        Home
      </a>
    </div>
  </main>
</body>
</html>
