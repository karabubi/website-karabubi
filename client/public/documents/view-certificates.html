<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#020617" />

  <title>Saleh Alkarabubi | Certificates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020617;
      color: #f8fafc;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .document-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 108px;
      padding: 22px 36px;
      background: #020617;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .identity-mark {
      display: grid;
      place-items: center;
      flex: 0 0 64px;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #2563eb;
      color: white;
      font-size: 24px;
      font-weight: 800;
    }

    .identity-copy strong {
      display: block;
      margin-bottom: 4px;
      font-size: 22px;
      line-height: 1.2;
    }

    .identity-copy span {
      color: #94a3b8;
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 24px;
      border: 1px solid #334155;
      border-radius: 16px;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-button.primary {
      border-color: #2563eb;
      background: #2563eb;
      color: white;
    }

    .viewer-shell {
      width: 100%;
      height: calc(100vh - 109px);
      background: #27272a;
    }

    .desktop-pdf {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .mobile-document {
      display: none;
    }

    @media (max-width: 768px) {
      .document-header {
        align-items: stretch;
        flex-direction: column;
        gap: 18px;
        min-height: auto;
        padding:
          max(22px, env(safe-area-inset-top))
          20px
          22px;
      }

      .identity-mark {
        flex-basis: 58px;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        font-size: 22px;
      }

      .identity-copy strong {
        font-size: 20px;
      }

      .identity-copy span {
        font-size: 15px;
      }

      .header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .nav-button {
        min-height: 52px;
        padding: 0 14px;
        border-radius: 14px;
        font-size: 16px;
      }

      .viewer-shell {
        height: auto;
        min-height: calc(100vh - 190px);
        padding: 18px;
        background: #f8fafc;
      }

      .desktop-pdf {
        display: none;
      }

      .mobile-document {
        display: block;
        max-width: 560px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #dbeafe;
        border-radius: 18px;
        background: white;
        color: #0f172a;
        text-align: center;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      }

      .mobile-document h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .mobile-document p {
        margin: 0 0 22px;
        color: #64748b;
        line-height: 1.6;
      }

      .open-pdf {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 54px;
        padding: 0 20px;
        border-radius: 14px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
      }

      .mobile-note {
        margin-top: 16px !important;
        margin-bottom: 0 !important;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header class="document-header">
    <div class="identity">
      <div class="identity-mark">SA</div>

      <div class="identity-copy">
        <strong>Saleh Alkarabubi</strong>
        <span>Certificates & Qualifications</span>
      </div>
    </div>

    <nav class="header-actions" aria-label="Document navigation">
      <a class="nav-button" href="/about">
        ← Back to About
      </a>

      <a class="nav-button primary" href="/">
        Home
      </a>
    </nav>
  </header>

  <main class="viewer-shell">
    <iframe
      class="desktop-pdf"
      src="/documents/saleh-alkarabubi-certificates.pdf#view=FitH"
      title="Saleh Alkarabubi Certificates and Qualifications"
    ></iframe>

    <section class="mobile-document">
      <h1>Certificates & Qualifications</h1>

      <p>
        On mobile devices, open the full PDF directly
        to view and scroll through all certificate pages.
      </p>

      <a
        class="open-pdf"
        href="/documents/saleh-alkarabubi-certificates.pdf"
        target="_self"
      >
        Open all certificates
      </a>

      <p class="mobile-note">
        The complete certificate PDF contains all pages.
      </p>
    </section>
  </main>
</body>
</html>
