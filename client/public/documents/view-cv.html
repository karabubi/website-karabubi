<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Saleh Alkarabubi | CV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020817;
      color: #f8fafc;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .viewer-header {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 15px 28px;
      border-bottom: 1px solid #1e293b;
      background: #020617;
    }

    .viewer-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .viewer-logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-weight: 800;
      font-size: 18px;
    }

    .viewer-title strong {
      display: block;
      font-size: 16px;
    }

    .viewer-title small {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
    }

    .viewer-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .viewer-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 17px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0f172a;
      color: #f8fafc;
      text-decoration: none;
      font-weight: 650;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .viewer-button:hover {
      background: #172033;
      border-color: #60a5fa;
      transform: translateY(-1px);
    }

    .viewer-button-primary {
      border-color: #2563eb;
      background: #2563eb;
    }

    .viewer-button-primary:hover {
      background: #1d4ed8;
    }

    .pdf-frame {
      width: 100%;
      flex: 1;
      min-height: calc(100vh - 82px);
      border: 0;
      background: white;
    }

    @media (max-width: 700px) {
      .viewer-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .viewer-actions {
        width: 100%;
      }

      .viewer-button {
        flex: 1;
      }

      .pdf-frame {
        min-height: calc(100vh - 150px);
      }
    }
  </style>
</head>

<body>
  <header class="viewer-header">
    <div class="viewer-title">
      <div class="viewer-logo">
        SA
      </div>

      <div>
        <strong>
          Saleh Alkarabubi
        </strong>

        <small>
          Curriculum Vitae
        </small>
      </div>
    </div>

    <nav class="viewer-actions">
      <a
        href="/about"
        class="viewer-button"
      >
        ← Back to About
      </a>

      <a
        href="/"
        class="viewer-button viewer-button-primary"
      >
        Home
      </a>
    </nav>
  </header>

  <iframe
    class="pdf-frame"
    src="/documents/saleh-alkarabubi-cv.pdf"
    title="Saleh Alkarabubi CV"
  ></iframe>
</body>
</html>
